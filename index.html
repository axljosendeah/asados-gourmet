<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asado Gourmet | Carta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--th:55px;--bg:#0a0a0a;--sf:#141210;--ln:#2a2520;--tx:#f4efe6;--mu:#9c9488;--gd:#c9a15b;--or:#f26a1b;--am:#ffb02e}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 Inter,system-ui,sans-serif}
.top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:calc(var(--th) + env(safe-area-inset-top,0));padding:0 18px;padding-top:env(safe-area-inset-top,0);background:#0a0a0af2;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.top div{display:flex;align-items:center;gap:10px;font:700 18px 'Playfair Display',serif;letter-spacing:.5px}
.top img{width:34px;height:34px;border-radius:50%}
.cb{background:none;border:1px solid var(--gd);color:var(--gd);padding:8px 16px;border-radius:4px;font:600 13px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.cb b{background:var(--or);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}
.hero{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 20px 60px;background:radial-gradient(ellipse at 50% 35%,#f26a1b55,transparent 60%),var(--bg)}
.hero img{width:210px;height:210px;border-radius:50%;box-shadow:0 0 70px #f26a1b44}
.hero h1{font:500 clamp(18px,4vw,24px)/1.4 'Playfair Display',serif;font-style:italic;color:var(--gd);margin-top:20px}
.hero p{color:var(--mu);margin-top:8px;font-size:15px}
.cta{display:inline-block;margin-top:24px;padding:14px 34px;background:linear-gradient(90deg,var(--or),var(--am));color:#111;font:600 13px Inter,sans-serif;letter-spacing:2px;text-transform:uppercase;text-decoration:none;border:0;border-radius:3px;cursor:pointer}
nav{position:sticky;top:calc(var(--th) + env(safe-area-inset-top,0));z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.tabs{position:relative;display:flex;gap:26px;overflow-x:auto;padding:0 18px;max-width:1040px;margin:auto;scrollbar-width:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--mu);padding:16px 0 12px;font:500 13px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--or)}
.wrap{max-width:1040px;margin:auto;padding:0 18px 140px}
.sr{padding:18px 0 0}
.sr input,.fm input,.fm textarea{width:100%;background:var(--sf);border:1px solid var(--ln);color:var(--tx);padding:13px 16px;border-radius:4px;font:400 15px Inter,sans-serif}
section{padding-top:56px;scroll-margin-top:calc(var(--th) + 62px + env(safe-area-inset-top,0))}
.sh{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--gd);padding-bottom:10px;margin-bottom:6px}
.sh i{font:italic 500 20px 'Playfair Display',serif;color:var(--or)}
h2{font:700 clamp(26px,6vw,36px) 'Playfair Display',serif}
.sn{color:var(--mu);font-size:14px;margin:8px 0}
.lst{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));column-gap:48px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:18px 0;border-bottom:1px solid var(--ln)}
.nm{font:600 19px/1.25 'Playfair Display',serif}
.nm em{font:600 10px Inter,sans-serif;font-style:normal;letter-spacing:1.5px;text-transform:uppercase;color:#111;background:var(--gd);padding:2px 7px;border-radius:2px;margin-left:8px;vertical-align:2px}
.ds{grid-column:1;color:var(--mu);font-size:14px}
.pr{grid-column:2;grid-row:1;font:600 19px Inter,sans-serif;color:var(--am);text-align:right}
.ct{grid-column:2;grid-row:2;justify-self:end;align-self:end}
.add{background:none;border:1px solid var(--or);color:var(--or);padding:6px 16px;border-radius:3px;font:600 12px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.qt{display:flex;align-items:center;gap:12px;font-weight:600}
.qt button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gd);background:none;color:var(--tx);font:500 18px/1 Inter,sans-serif;cursor:pointer}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:40;display:none;gap:30px;width:min(92%,520px);justify-content:space-between;padding:16px 22px;background:linear-gradient(90deg,var(--or),var(--am));color:#111;font:600 14px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;border:0;border-radius:4px;box-shadow:0 10px 30px #000a;cursor:pointer}
.bar.s{display:flex}
.ov{position:fixed;inset:0;background:#000c;z-index:50;visibility:hidden;opacity:0;transition:.25s}
.ov.s{visibility:visible;opacity:1}
.pn{position:absolute;right:0;top:0;bottom:0;width:min(100%,440px);background:var(--sf);border-left:1px solid var(--gd);padding:24px 22px calc(24px + env(safe-area-inset-bottom,0));overflow:auto;transform:translateX(100%);transition:.25s}
.ov.s .pn{transform:none}
.pn h3{font:700 28px 'Playfair Display',serif;margin-bottom:8px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.ln small{color:var(--mu)}
.tt{display:flex;justify-content:space-between;font:700 24px 'Playfair Display',serif;padding:16px 0}
.mode{display:flex;margin:4px 0 12px;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.mode button{flex:1;padding:11px;background:none;border:0;color:var(--mu);font:600 12px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer}
.mode button.on{background:var(--gd);color:#111}
.fm{display:grid;gap:10px}.fm textarea{resize:none;height:70px}
.er{color:#ff8f7a;font-size:14px;min-height:20px;margin-top:6px}
.act{display:grid;gap:10px;margin-top:6px}
.act .cta{margin:0;text-align:center}
.act .sec{background:none;border:1px solid var(--ln);color:var(--mu);padding:11px;border-radius:3px;font:500 13px Inter,sans-serif;cursor:pointer}
footer{border-top:1px solid var(--ln);text-align:center;color:var(--mu);padding:36px 18px 110px;font-size:14px;line-height:1.9}
footer a{color:var(--gd)}
</style></head><body>

['Chicken Clásica','120 gr de pechuga de pollo, cebolla, lechuga, tomate y salsas tradicionales',4.5],

['Chicken Especial','150 gr de pollo crispy, tomate, lechuga, salsas, queso kraft y tocineta',5.9],

['Bacon Burger','240 gr de carne, tomate, lechuga, cebolla, salsas, tocineta y doble queso kraft',8.5]]},
{id:'alitas',n:'Alitas y tenders',it:[['Alitas BBQ picantes','350 gr de alitas BBQ y 200 gr de papas fritas',7.9,'Picante'],['Alitas BBQ','350 gr de alitas BBQ y 200 gr de papas fritas',7.9],['Tenders','200 gr de pechuga empanizada y 150 gr de papas fritas',5.9]]},
{id:'cachapas',n:'Cachapas',it:[['Cachapa viuda','',2],['Cachapa con queso','',3.5],['Cachapa con queso y aguacate','',4],['Cachapa con cochino, queso y aguacate','',8.5]]},
{id:'platos',n:'Ensalada y pasticho',it:[['Ensalada César','',8],['Pasticho','',6]]},
{id:'raciones',n:'Raciones',it:[['Ensalada','',3],['Arepitas fritas','',3],['Bollitos','',3],['Aguacate','',2],['Papas fritas','',4]]},
{id:'bebidas',n:'Bebidas',it:[['Refresco 2 L','',3],['Refresco 1,5 L','',2.5],['Refresco 1 L','',2],['Refresco 300 ml','',1],['Malta 1,5 L','',2.5],['Malta 250 ml','',1.5],['Jugos naturales','',2],['Agua 300 ml','',0.7]]}];
const $=s=>document.querySelector(s),money=n=>'$'+(Number.isInteger(n)?n:n.toFixed(2).replace('.',','));
const item=k=>{const[c,i]=k.split('-');return M[c].it[i]};
let cart={},f={mode:'Delivery',name:'',addr:'',note:''};
try{cart=JSON.parse(localStorage.getItem('ag_cart')||'{}');f=Object.assign(f,JSON.parse(localStorage.getItem('ag_form')||'{}'))}catch(e){}
Object.keys(cart).forEach(k=>{try{item(k)[2]}catch(e){delete cart[k]}});
const save=()=>{try{localStorage.setItem('ag_cart',JSON.stringify(cart));localStorage.setItem('ag_form',JSON.stringify(f))}catch(e){}};
const tot=()=>Object.keys(cart).reduce((a,k)=>a+cart[k]*item(k)[2],0);
const stp=(k,q)=>`<div class="qt"><button data-a="-" data-k="${k}" aria-label="Quitar uno">−</button>${q}<button data-a="+" data-k="${k}" aria-label="Agregar uno">+</button></div>`;
function row(ci,ii){const[n,d,p,t]=M[ci].it[ii],k=ci+'-'+ii,q=cart[k]||0;
return `<div class="row" data-c="${k}"><div class="nm">${n}${t?`<em>${t}</em>`:''}</div><div class="pr">${money(p)}</div>${d?`<div class="ds">${d}</div>`:''}<div class="ct">${q?stp(k,q):`<button class="add" data-a="+" data-k="${k}">Agregar</button>`}</div></div>`}
$('#menu').innerHTML=M.map((c,ci)=>`<section id="${c.id}"><div class="sh"><i>${String(ci+1).padStart(2,'0')}</i><h2>${c.n}</h2></div>${c.note?`<p class="sn">${c.note}</p>`:''}<div class="lst">${c.it.map((_,ii)=>row(ci,ii)).join('')}</div></section>`).join('');
$('#tabs').innerHTML=M.map(c=>`<button class="tab" data-s="${c.id}">${c.n}</button>`).join('');
function msg(){const ks=Object.keys(cart);
return `Hola Asado Gourmet 👋, quiero hacer este pedido:\n`+ks.map(k=>`• ${cart[k]} x ${item(k)[0]} (${money(cart[k]*item(k)[2])})`).join('\n')+`\n\n*Total: ${money(tot())}*\nModalidad: ${f.mode}`+(f.name?`\nNombre: ${f.name}`:'')+(f.mode==='Delivery'&&f.addr?`\nDirección: ${f.addr}`:'')+(f.note?`\nNotas: ${f.note}`:'')+(f.mode==='Delivery'?'\n(Por favor confírmenme el costo del delivery)':'')}
function sheet(){const ks=Object.keys(cart),d=f.mode==='Delivery';
$('#pn').innerHTML=`<h3>Tu pedido</h3>${ks.map(k=>`<div class="ln"><span>${item(k)[0]}<br><small>${money(item(k)[2])} c/u</small></span>${stp(k,cart[k])}</div>`).join('')}<div class="tt"><span>Total</span><span>${money(tot())}</span></div>
<div class="mode"><button data-m="Delivery" class="${d?'on':''}">Delivery</button><button data-m="Retiro" class="${d?'':'on'}">Retiro</button></div>
<div class="fm"><input id="fn" placeholder="Tu nombre" value="${f.name}">${d?`<input id="fa" placeholder="Dirección o punto de referencia" value="${f.addr}">`:''}<textarea id="fo" placeholder="Notas (sin cebolla, término de la carne…)">${f.note}</textarea></div>
<div class="er" id="er"></div><div class="act"><button class="cta" id="go">Enviar por WhatsApp</button><button class="sec" id="cl">Seguir viendo la carta</button><button class="sec" id="em">Vaciar pedido</button></div>`}
function upd(){const n=Object.keys(cart).reduce((a,k)=>a+cart[k],0);
$('#cn').textContent=n;$('#bar').className='bar'+(n?' s':'');$('#bar').innerHTML=`<span>Ver pedido · ${n}</span><span>${money(tot())}</span>`;
if(!n)$('#ov').classList.remove('s');else if($('#ov').classList.contains('s'))sheet();save()}
const open=()=>{if(Object.keys(cart).length){sheet();$('#ov').classList.add('s')}};
const redraw=()=>document.querySelectorAll('[data-c]').forEach(el=>{const[c,i]=el.dataset.c.split('-');el.outerHTML=row(c,i)});
document.addEventListener('click',e=>{const t=e.target;let x;
if(x=t.closest('[data-s]')){document.getElementById(x.dataset.s).scrollIntoView();return}
if(x=t.closest('[data-m]')){f.mode=x.dataset.m;sheet();save();return}
if(x=t.closest('[data-a]')){const k=x.dataset.k;cart[k]=(cart[k]||0)+(x.dataset.a==='+'?1:-1);if(cart[k]<=0)delete cart[k];
const el=document.querySelector(`[data-c="${k}"]`);if(el){const[c,i]=k.split('-');el.outerHTML=row(c,i)}upd();return}
if(t.id==='cl')$('#ov').classList.remove('s');
if(t.id==='em'){cart={};redraw();upd()}
if(t.id==='go'){if(!f.name.trim()){$('#er').textContent='Escribe tu nombre para enviar el pedido.';return}
if(f.mode==='Delivery'&&!f.addr.trim()){$('#er').textContent='Escribe tu dirección para el delivery.';return}
window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg()),'_blank')}});
document.addEventListener('input',e=>{const m={fn:'name',fa:'addr',fo:'note'}[e.target.id];if(m){f[m]=e.target.value;save()}});
$('#bar').onclick=open;$('#cb').onclick=open;
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('s')};
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();
document.querySelectorAll('.row').forEach(r=>r.style.display=!v||r.textContent.toLowerCase().includes(v)?'':'none');
document.querySelectorAll('section').forEach(s=>s.style.display=!v||[...s.querySelectorAll('.row')].some(r=>r.style.display!=='none')?'':'none')};
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)document.querySelectorAll('.tab').forEach(c=>{const on=c.dataset.s===x.target.id;c.classList.toggle('on',on);if(on){const tb=$('#tabs');tb.scrollTo({left:c.offsetLeft-tb.clientWidth/2+c.offsetWidth/2,behavior:'smooth'})}})}),{rootMargin:'-30% 0px -65% 0px'});
document.querySelectorAll('section').forEach(s=>io.observe(s));
upd();
</script></body></html>
